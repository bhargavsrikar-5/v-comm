# V-COMM backend configuration. All deployment secrets are supplied through environment variables.
server.port=${SERVER_PORT:8080}
spring.application.name=vcomm-backend

# Local development uses an ephemeral H2 database. Set DB_URL/DB_DRIVER/DB_USERNAME/DB_PASSWORD for MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:vcomm_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Versioned Flyway migrations are the schema source of truth.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# HS256 signing key: provide JWT_SECRET with at least 32 UTF-8 bytes.
vcomm.security.jwt-secret=${JWT_SECRET:}
vcomm.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:43200}

# Comma-separated browser origins; native Flutter clients do not use browser CORS.
vcomm.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5000,http://127.0.0.1:5000}

# Optional first-run administrator bootstrap. Both variables must be set together.
vcomm.bootstrap.admin-email=${VCOMM_ADMIN_EMAIL:}
vcomm.bootstrap.admin-password=${VCOMM_ADMIN_PASSWORD:}
vcomm.bootstrap.admin-name=${VCOMM_ADMIN_NAME:V-COMM Administrator}

spring.jackson.time-zone=UTC
server.error.include-message=never
server.error.include-stacktrace=never
