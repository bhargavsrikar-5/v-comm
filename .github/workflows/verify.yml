name: Verify V-COMM

on:
  push:
    branches:
      - migration/clean-source-audit
  pull_request:
    branches:
      - migration/clean-source-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress test

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze --fatal-infos
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test --no-pub

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug --no-pub

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build iOS simulator app
        working-directory: mobile
        run: flutter build ios --simulator --no-codesign --no-pub
